name: Update Snapshot Data SUMKAL

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CSV snapshot from Google Sheets
        env:
          SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -n "$SHEET_ID" ]; then
            mkdir -p data
            curl -sL "https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=SUMKAL" -o data/sumkal_snapshot.csv
          fi

      - name: Commit & Push updated snapshot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/sumkal_snapshot.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data SUMKAL" && git push)
